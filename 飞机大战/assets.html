<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战 - 素材生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 30px;
            font-size: 36px;
        }
        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .asset-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .asset-card:hover {
            transform: scale(1.05);
        }
        .asset-card canvas {
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .asset-card h3 {
            margin-bottom: 10px;
            color: #88ccff;
        }
        .btn {
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,107,53,0.6);
        }
        .btn-download {
            background: linear-gradient(145deg, #44aa44, #228822);
        }
        .btn-download:hover {
            box-shadow: 0 5px 20px rgba(68,170,68,0.6);
        }
        .game-link {
            text-align: center;
            margin-top: 30px;
        }
        .game-link a {
            color: #ffcc00;
            font-size: 20px;
            text-decoration: none;
        }
        .game-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>飞机大战 - PNG素材生成器</h1>
        <p style="text-align: center; margin-bottom: 30px; color: #aaa;">
            点击下方按钮生成飞机大战游戏所需的PNG图片素材
        </p>
        
        <div class="assets-grid" id="assetsGrid">
            <!-- 素材卡片将通过JavaScript动态生成 -->
        </div>
        
        <div style="text-align: center; margin: 30px 0;">
            <button class="btn btn-download" onclick="downloadAll()">下载全部素材</button>
        </div>
        
        <div class="game-link">
            <a href="game.html">点击这里开始游戏 →</a>
        </div>
    </div>

    <script>
        // 素材定义
        const assetDefinitions = [
            {
                name: '玩家飞机',
                id: 'player',
                width: 60,
                height: 70,
                draw: function(ctx) {
                    // 机身
                    ctx.fillStyle = '#4488ff';
                    ctx.beginPath();
                    ctx.moveTo(30, 0);
                    ctx.lineTo(45, 20);
                    ctx.lineTo(50, 55);
                    ctx.lineTo(40, 70);
                    ctx.lineTo(20, 70);
                    ctx.lineTo(10, 55);
                    ctx.lineTo(15, 20);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 机翼
                    ctx.fillStyle = '#3366dd';
                    ctx.beginPath();
                    ctx.moveTo(5, 35);
                    ctx.lineTo(55, 35);
                    ctx.lineTo(50, 45);
                    ctx.lineTo(10, 45);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 驾驶舱
                    ctx.fillStyle = '#88ccff';
                    ctx.beginPath();
                    ctx.ellipse(30, 20, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 尾翼
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.moveTo(25, 60);
                    ctx.lineTo(35, 60);
                    ctx.lineTo(40, 70);
                    ctx.lineTo(20, 70);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 引擎火焰
                    const flameGrad = ctx.createLinearGradient(30, 65, 30, 80);
                    flameGrad.addColorStop(0, '#ff8800');
                    flameGrad.addColorStop(1, '#ffcc00');
                    ctx.fillStyle = flameGrad;
                    ctx.beginPath();
                    ctx.moveTo(25, 70);
                    ctx.lineTo(35, 70);
                    ctx.lineTo(32, 85);
                    ctx.lineTo(28, 85);
                    ctx.closePath();
                    ctx.fill();
                }
            },
            {
                name: '敌机1 (小型)',
                id: 'enemy1',
                width: 40,
                height: 40,
                draw: function(ctx) {
                    // 机身
                    ctx.fillStyle = '#ff5555';
                    ctx.beginPath();
                    ctx.moveTo(20, 40);
                    ctx.lineTo(35, 10);
                    ctx.lineTo(40, 0);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(5, 10);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 机翼
                    ctx.fillStyle = '#cc0000';
                    ctx.beginPath();
                    ctx.moveTo(5, 15);
                    ctx.lineTo(35, 15);
                    ctx.lineTo(30, 25);
                    ctx.lineTo(10, 25);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 驾驶舱
                    ctx.fillStyle = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc(20, 12, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            {
                name: '敌机2 (中型)',
                id: 'enemy2',
                width: 50,
                height: 50,
                draw: function(ctx) {
                    // 机身
                    ctx.fillStyle = '#aa55ff';
                    ctx.beginPath();
                    ctx.moveTo(25, 50);
                    ctx.lineTo(45, 15);
                    ctx.lineTo(50, 0);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(5, 15);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 机翼
                    ctx.fillStyle = '#8800cc';
                    ctx.beginPath();
                    ctx.moveTo(0, 20);
                    ctx.lineTo(50, 20);
                    ctx.lineTo(45, 35);
                    ctx.lineTo(5, 35);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 驾驶舱
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(25, 15, 6, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 武器
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(10, 35, 5, 10);
                    ctx.fillRect(35, 35, 5, 10);
                }
            },
            {
                name: '敌机3 (大型)',
                id: 'enemy3',
                width: 70,
                height: 70,
                draw: function(ctx) {
                    // 机身
                    ctx.fillStyle = '#55aaff';
                    ctx.beginPath();
                    ctx.moveTo(35, 70);
                    ctx.lineTo(60, 20);
                    ctx.lineTo(70, 0);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(10, 20);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 机翼
                    ctx.fillStyle = '#3388dd';
                    ctx.beginPath();
                    ctx.moveTo(0, 25);
                    ctx.lineTo(70, 25);
                    ctx.lineTo(65, 45);
                    ctx.lineTo(5, 45);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 驾驶舱
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.ellipse(35, 20, 10, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 武器
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(15, 45, 8, 15);
                    ctx.fillRect(47, 45, 8, 15);
                }
            },
            {
                name: '玩家子弹',
                id: 'bullet',
                width: 12,
                height: 24,
                draw: function(ctx) {
                    const grad = ctx.createLinearGradient(6, 0, 6, 24);
                    grad.addColorStop(0, '#ffff00');
                    grad.addColorStop(0.5, '#ffaa00');
                    grad.addColorStop(1, '#ff6600');
                    ctx.fillStyle = grad;
                    
                    ctx.beginPath();
                    ctx.moveTo(6, 0);
                    ctx.lineTo(12, 8);
                    ctx.lineTo(10, 24);
                    ctx.lineTo(2, 24);
                    ctx.lineTo(0, 8);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 光晕效果
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(6, 12, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            {
                name: '敌机子弹',
                id: 'enemyBullet',
                width: 10,
                height: 20,
                draw: function(ctx) {
                    const grad = ctx.createLinearGradient(5, 0, 5, 20);
                    grad.addColorStop(0, '#ff00ff');
                    grad.addColorStop(0.5, '#cc00cc');
                    grad.addColorStop(1, '#880088');
                    ctx.fillStyle = grad;
                    
                    ctx.beginPath();
                    ctx.moveTo(5, 20);
                    ctx.lineTo(10, 6);
                    ctx.lineTo(5, 0);
                    ctx.lineTo(0, 6);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 光晕效果
                    ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
                    ctx.beginPath();
                    ctx.arc(5, 10, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            {
                name: '生命道具',
                id: 'health',
                width: 30,
                height: 30,
                draw: function(ctx) {
                    // 红心形状
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.moveTo(15, 25);
                    ctx.bezierCurveTo(15, 25, 0, 15, 0, 8);
                    ctx.bezierCurveTo(0, 0, 8, 0, 15, 8);
                    ctx.bezierCurveTo(22, 0, 30, 0, 30, 8);
                    ctx.bezierCurveTo(30, 15, 15, 25, 15, 25);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 高光
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.beginPath();
                    ctx.arc(10, 10, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            },
            {
                name: '火力道具',
                id: 'power',
                width: 30,
                height: 30,
                draw: function(ctx) {
                    // 闪电形状
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.moveTo(15, 0);
                    ctx.lineTo(20, 10);
                    ctx.lineTo(15, 10);
                    ctx.lineTo(18, 30);
                    ctx.lineTo(10, 15);
                    ctx.lineTo(15, 15);
                    ctx.lineTo(12, 0);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 高光
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(14, 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        ];

        // 存储生成的canvas元素
        const assetCanvases = {};

        // 初始化素材生成器
        function init() {
            const grid = document.getElementById('assetsGrid');
            
            assetDefinitions.forEach(asset => {
                // 创建卡片
                const card = document.createElement('div');
                card.className = 'asset-card';
                
                // 创建canvas
                const canvas = document.createElement('canvas');
                canvas.width = asset.width;
                canvas.height = asset.height;
                canvas.id = `canvas-${asset.id}`;
                
                // 绘制素材
                const ctx = canvas.getContext('2d');
                asset.draw(ctx);
                
                // 保存canvas引用
                assetCanvases[asset.id] = canvas;
                
                // 创建标题
                const title = document.createElement('h3');
                title.textContent = asset.name;
                
                // 创建尺寸信息
                const sizeInfo = document.createElement('p');
                sizeInfo.style.color = '#888';
                sizeInfo.style.fontSize = '12px';
                sizeInfo.textContent = `${asset.width} x ${asset.height} px`;
                
                // 创建下载按钮
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'btn';
                downloadBtn.textContent = '下载PNG';
                downloadBtn.onclick = () => downloadAsset(asset.id, asset.name);
                
                // 组装卡片
                card.appendChild(canvas);
                card.appendChild(title);
                card.appendChild(sizeInfo);
                card.appendChild(downloadBtn);
                
                grid.appendChild(card);
            });
        }

        // 下载单个素材
        function downloadAsset(id, name) {
            const canvas = assetCanvases[id];
            const link = document.createElement('a');
            link.download = `${name}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 下载全部素材
        function downloadAll() {
            assetDefinitions.forEach((asset, index) => {
                setTimeout(() => {
                    downloadAsset(asset.id, asset.name);
                }, index * 200); // 延迟下载，避免浏览器阻止
            });
        }

        // 初始化
        init();
    </script>
</body>
</html>
