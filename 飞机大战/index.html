<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #ffcc00;
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(255,204,0,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .subtitle {
            color: #88ccff;
            font-size: 24px;
            margin-bottom: 50px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .btn {
            background: linear-gradient(145deg, #ff6b35, #ff4500);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            border-radius: 40px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255,69,0,0.4);
            min-width: 280px;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,69,0,0.6);
        }
        .btn-secondary {
            background: linear-gradient(145deg, #4488ff, #2266dd);
            box-shadow: 0 5px 15px rgba(34,102,221,0.4);
        }
        .btn-secondary:hover {
            box-shadow: 0 8px 25px rgba(34,102,221,0.6);
        }
        .plane-decoration {
            font-size: 100px;
            margin-bottom: 30px;
            animation: fly 3s ease-in-out infinite;
        }
        @keyframes fly {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .footer {
            color: #666;
            margin-top: 50px;
            font-size: 14px;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        .feature {
            color: #aaa;
            font-size: 16px;
        }
        .feature span {
            display: block;
            font-size: 32px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="plane-decoration">✈</div>
        <h1>飞机大战</h1>
        <div class="subtitle">经典射击游戏 - HTML5版</div>
        
        <div class="features">
            <div class="feature">
                <span>🎮</span>
                简单操作
            </div>
            <div class="feature">
                <span>💥</span>
                炫酷特效
            </div>
            <div class="feature">
                <span>🚀</span>
                多种敌机
            </div>
            <div class="feature">
                <span>🎁</span>
                道具系统
            </div>
        </div>
        
        <div class="buttons">
            <a href="game.html" class="btn">开始游戏</a>
            <a href="assets.html" class="btn btn-secondary">查看/下载素材</a>
        </div>
        
        <div class="footer">
            使用HTML5 Canvas制作 | 支持键盘方向键操作
        </div>
    </div>
</body>
</html>
